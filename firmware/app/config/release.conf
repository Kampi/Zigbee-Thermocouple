# Release configuration with focus on low power consumption
CONFIG_DEBUG=n

# Small code, no debugger friendly optimizations
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=y

# No logging and no console output. Every log message wakes up the CPU and
# the log thread, and RTT keeps the debug domain powered.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_BOOT_BANNER=n
CONFIG_ZBOSS_ERROR_PRINT_TO_LOG=n

# No runtime checks
CONFIG_ASSERT=n
CONFIG_INIT_STACKS=n
CONFIG_STACK_SENTINEL=n
CONFIG_THREAD_NAME=n

# Reboot on a fatal error, so the device recovers without a debugger
CONFIG_RESET_ON_FATAL_ERROR=y

# Suspend unused peripherals (e.g. the I2C controller) between the measurements
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
