CONFIG_DEBUG=y

# Debugger friendly optimizations
CONFIG_DEBUG_OPTIMIZATIONS=y

# Thread awareness for the debugger
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y

# Runtime checks
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Halt on a fatal error instead of rebooting, so the debugger can inspect it
CONFIG_RESET_ON_FATAL_ERROR=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

# No UART is routed on this board, use RTT as log backend
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=256
CONFIG_LOG_BLOCK_IN_THREAD=y

# Measure more often than in the release build
CONFIG_THERMOCOUPLE_MEASUREMENT_INTERVAL_S=30
CONFIG_THERMOCOUPLE_BATTERY_INTERVAL_S=300
