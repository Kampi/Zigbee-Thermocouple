# =============================================================================
# Workflow: Init KiBot Release
# =============================================================================
#
# Trigger:
#   - On creation of a new branch matching the pattern '*_Dev'
#
# Function:
#   Runs once when a new development branch is created. Executes the Python
#   script 'init_release.py' which:
#     - Adds RELEASE_TITLE_X.Y.Z and RELEASE_BODY_X.Y.Z entries to the
#       KiBot preflight YAML (kibot_pre_set_text_variables.yaml)
#     - Adds the corresponding text variables to the KiCad project file (.kicad_pro)
#     - Sets 'kibot_variant' in pcb.yml to 'PRELIMINARY'
#   The resulting changes are committed and pushed back to the branch.
#
# Variables:
#   kicad_board       - Name of the KiCad PCB file (without extension)
#   kibot_input_dir   - Directory containing the KiCad project and KiBot files
#
# Secrets:
#   WORKFLOW_PAT      - Personal Access Token with 'repo' and 'workflow' scopes.
#                       Required to push changes to workflow files (.github/workflows/).
# =============================================================================

name: Init KiBot Release

on:
  create:

permissions:
  contents: write

env:
  # Name of the KiCad PCB file
  kicad_board: Thermocouple

  # Input directory with the KiCad project and the KiBot files
  kibot_input_dir: thermocouple

jobs:
  init-release:
    runs-on: ubuntu-latest

    if: github.ref_type == 'branch' && endsWith(github.ref, '_Dev')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run release init script
        run: python ${{ env.kibot_input_dir }}/scripts/init_release.py ${GITHUB_REF_NAME} ${{ env.kibot_input_dir }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ${{ env.kibot_input_dir }}/kibot_yaml/kibot_pre_set_text_variables.yaml
          git add ${{ env.kibot_input_dir }}/${{ env.kicad_board }}.kicad_pro
          git add .github/workflows/pcb.yml
          git commit -m "Auto add release vars for ${GITHUB_REF_NAME}" || echo "No changes"
          git remote set-url origin https://x-access-token:${{ secrets.WORKFLOW_PAT }}@github.com/${{ github.repository }}
          git push

